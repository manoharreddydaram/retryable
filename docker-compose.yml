services:
  db:
    image: postgres:16-alpine
    container_name: retryable-db
    environment:
      POSTGRES_USER: retryable
      POSTGRES_PASSWORD: retryable
      POSTGRES_DB: retryable
    ports:
      - "5432:5432"
    volumes:
      - retryable_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retryable -d retryable"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  retryable_pgdata:
